[versions]
# ANDROIDX
androidx-activity-compose = "1.9.0"
androidx-core-ktx = "1.13.1"
androidx-lifecycle-runtime = "2.8.3"
lifecycle-viewmodel-compose = "2.8.3"

# COMPOSE
compose-bom = "2024.06.00"

# GSON
gson = "2.11.0"

# KOIN
koin-android = "3.5.6"
koin-compose = "3.5.6"

# KOTLINX
kotlin-serialization = "1.6.3"

# MAPS
google-maps = "6.0.0"
sonar = "7.2.3.7755"

# NAVIGATION
navigation-compose = "2.8.0-beta04"

# NETWORK
moshi-kotlin = "1.14.0"
okhttp3 = "5.0.0-alpha.7"
retrofit2 = "2.11.0"

# PLUGINS
android-gradle-plugin = "8.3.2"
google-ksp = "1.9.23-1.0.20"
kotlin-android = "1.9.24"

# PREFERENCES
datastore-preferences = "1.1.1"

# TEST
junit = "4.13.2"
test-ext = "1.2.1"
test-espresso-core = "3.6.1"
ui-tooling-preview-android = "1.6.8"

[libraries]
# ANDROIDX
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle-runtime" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle-runtime" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose" }

# COMPOSE
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version = "1.7.0-beta04" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling-preview-android = { group = "androidx.compose.ui", name = "ui-tooling-preview-android" }

# GSON
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# KOIN
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin-android" }
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin-compose" }

# KOTLINX
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlin-serialization" }

# MAPS
google-maps = { group = "com.google.maps.android", name = "maps-compose", version.ref = "google-maps" }

# NAVIGATION
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# NETWORK
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi-kotlin" }
okhttp3 = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp3" }
retrofit2 = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit2" }
retrofit2-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit2" }

# PREFERENCES
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore-preferences" }

# TEST
junit = { group = "junit", name = "junit", version.ref = "junit" }
test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "test-espresso-core" }
test-ext = { group = "androidx.test.ext", name = "junit", version.ref = "test-ext" }
ui-tooling-preview-android = { group = "androidx.compose.ui", name = "ui-tooling-preview-android", version.ref = "ui-tooling-preview-android" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "google-ksp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-android" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-android" }
sonar = { id = "org.sonarqube", version.ref = "sonar" }